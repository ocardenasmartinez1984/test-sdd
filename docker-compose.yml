services:
  postgres:
    image: postgres:16-alpine
    container_name: saga-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  mongodb:
    image: mongo:7.0
    container_name: saga-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - saga-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: saga-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - saga-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: on-failure

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: saga-eureka-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DYNATRACE_ENABLED: ${DYNATRACE_ENABLED:-false}
      DYNATRACE_URI: ${DYNATRACE_URI:-}
      DYNATRACE_API_TOKEN: ${DYNATRACE_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - saga-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: on-failure

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: saga-api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      DYNATRACE_ENABLED: ${DYNATRACE_ENABLED:-false}
      DYNATRACE_URI: ${DYNATRACE_URI:-}
      DYNATRACE_API_TOKEN: ${DYNATRACE_API_TOKEN:-}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saga-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: on-failure

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: saga-auth-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - saga-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: on-failure

  stock-service:
    build:
      context: .
      dockerfile: stock-service/Dockerfile
    container_name: saga-stock-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/stock_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      DYNATRACE_ENABLED: ${DYNATRACE_ENABLED:-false}
      DYNATRACE_URI: ${DYNATRACE_URI:-}
      DYNATRACE_API_TOKEN: ${DYNATRACE_API_TOKEN:-}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saga-network
    restart: on-failure

  venta-service:
    build:
      context: .
      dockerfile: venta-service/Dockerfile
    container_name: saga-venta-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/venta_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DYNATRACE_ENABLED: ${DYNATRACE_ENABLED:-false}
      DYNATRACE_URI: ${DYNATRACE_URI:-}
      DYNATRACE_API_TOKEN: ${DYNATRACE_API_TOKEN:-}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - saga-network
    restart: on-failure

  despacho-service:
    build:
      context: .
      dockerfile: despacho-service/Dockerfile
    container_name: saga-despacho-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/despacho_db?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DYNATRACE_ENABLED: ${DYNATRACE_ENABLED:-false}
      DYNATRACE_URI: ${DYNATRACE_URI:-}
      DYNATRACE_API_TOKEN: ${DYNATRACE_API_TOKEN:-}
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - saga-network
    restart: on-failure

  ventas-mantenedor:
    build:
      context: ./ventas-mantenedor
      dockerfile: Dockerfile
    container_name: saga-ventas-mantenedor
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - saga-network
    restart: on-failure

  users-mantenedor:
    build:
      context: ./users-mantenedor
      dockerfile: Dockerfile
    container_name: saga-users-mantenedor
    ports:
      - "4400:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - saga-network
    restart: on-failure

  pos-frontend:
    build:
      context: .
      dockerfile: pos-frontend/Dockerfile
    container_name: saga-pos-frontend
    ports:
      - "4300:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - saga-network
    restart: on-failure

  postgres-sonar:
    image: postgres:16-alpine
    container_name: saga-postgres-sonar
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    networks:
      - saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d sonarqube"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  sonarqube:
    image: sonarqube:lts-community
    container_name: saga-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    depends_on:
      postgres-sonar:
        condition: service_healthy
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - saga-network
    restart: on-failure

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: saga-jenkins
    user: root
    ports:
      - "8888:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Xmx1024m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - saga-network
    restart: on-failure

  # dynatrace-oneagent:
  #   image: dynatrace/oneagent:latest
  #   container_name: saga-dynatrace-oneagent
  #   privileged: true
  #   pid: host
  #   network_mode: host
  #   environment:
  #     ONEAGENT_INSTALLER_SCRIPT_URL: ${DT_ONEAGENT_URL:-}
  #     ONEAGENT_INSTALLER_DOWNLOAD_TOKEN: ${DT_PAAS_TOKEN:-}
  #   volumes:
  #     - /:/mnt/root
  #     - dynatrace_oneagent:/opt/dynatrace/oneagent
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: saga-redis
    ports:
      - "6379:6379"
    networks:
      - saga-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    restart: on-failure

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: saga-zipkin
    ports:
      - "9411:9411"
    networks:
      - saga-network
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: saga-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - saga-network
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: saga-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - saga-network
    restart: on-failure

volumes:
  postgres_data:
  mongodb_data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_sonar_data:
  dynatrace_oneagent:
  prometheus_data:
  grafana_data:

networks:
  saga-network:
    driver: bridge
