apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 172.19.0.5:5000/pos-test-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/auth_db
            - name: SPRING_DATASOURCE_USERNAME
              value: auth_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: auth_pass
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: saga
spec:
  selector:
    app: auth-service
  ports:
    - port: 8084
      targetPort: 8084
---
