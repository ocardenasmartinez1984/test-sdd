org.gradle.daemon=false
# Build performance: reuse outputs and run independent tasks/projects in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# The build box has only 4 CPUs and is shared with the running stack, so cap
# workers to avoid thrashing (leave headroom for the containers).
org.gradle.workers.max=2
org.gradle.configureondemand=true
# Keep the build JVM heap bounded so it doesn't get OOM-killed on the 7GB host.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseParallelGC
