plugins {
    id 'org.springframework.boot' version '3.3.2' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'org.sonarqube' version '7.4.0.8496'
}

sonar {
    properties {
        property "sonar.host.url", System.getProperty("sonar.host.url", "http://localhost:9000")
        property "sonar.token", System.getenv('SONAR_TOKEN') ?: System.getProperty('sonar.token', '')
        property "sonar.projectKey", "saga-microservices"
        property "sonar.projectName", "Saga Microservices"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.java.coveragePlugin", "jacoco"
    }
}

ext {
    set('springCloudVersion', "2023.0.3")
}

subprojects {
    if (project.name == 'stress-test') return

    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    jacoco {
        toolVersion = "0.8.12"
    }

    tasks.named('test') {
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                limit {
                    minimum = 0.70
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn jacocoTestCoverageVerification
    }

    group = 'com'
    version = '1.0.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
        implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

        // OpenAPI / Swagger documentation
        implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0'

        // Dynatrace monitoring via Micrometer
        implementation 'io.micrometer:micrometer-registry-dynatrace:1.13.2'
        implementation 'io.micrometer:micrometer-registry-prometheus:1.13.2'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // Distributed tracing with Micrometer + Zipkin
        implementation 'io.micrometer:micrometer-tracing-bridge-brave'
        implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'io.projectreactor:reactor-test'
        testImplementation 'org.testcontainers:testcontainers:1.19.8'
        testImplementation 'org.testcontainers:junit-jupiter:1.19.8'
        testImplementation 'org.testcontainers:mongodb:1.19.8'
        testImplementation 'org.testcontainers:kafka:1.19.8'
        testImplementation 'org.testcontainers:postgresql:1.19.8'
    }

    tasks.named('test') {
        useJUnitPlatform {
            // Integration tests (Testcontainers) need a reliable Docker daemon,
            // which isn't available in the Jenkins/Docker Desktop CI environment.
            // They are excluded from the default `test` task (and therefore from
            // the CI `build`). Run them explicitly with `integrationTest` locally,
            // or pass -PincludeIntegration to include them here.
            if (!project.hasProperty('includeIntegration')) {
                excludeTags 'integration'
            }
        }
    }

    // Dedicated task to run ONLY the integration tests (requires a working
    // Docker environment, e.g. a local machine). Usage: ./gradlew integrationTest
    tasks.register('integrationTest', Test) {
        description = 'Runs integration tests tagged with "integration".'
        group = 'verification'
        useJUnitPlatform {
            includeTags 'integration'
        }
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        shouldRunAfter tasks.named('test')
    }
}
