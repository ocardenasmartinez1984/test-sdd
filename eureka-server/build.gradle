// Eureka Server - Service Discovery

ext {
    set('springCloudVersion', "2023.0.3")
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'

    // Quitar dependencias del parent que no se necesitan
    configurations {
        implementation.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-mongodb'
        implementation.exclude group: 'org.springframework.kafka', module: 'spring-kafka'
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
