// Auth Service - Autenticación y Autorización con PostgreSQL + JWT

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'

    // OpenAPI / Swagger documentation (MVC variant for auth-service)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Quitar dependencias del parent que no se necesitan
    configurations {
        implementation.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webflux'
        implementation.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-data-mongodb-reactive'
        implementation.exclude group: 'org.springframework.kafka', module: 'spring-kafka'
        implementation.exclude group: 'org.springdoc', module: 'springdoc-openapi-starter-webflux-ui'
    }

    // Eureka client needs WebClient (reactor-netty) for communication
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
}
