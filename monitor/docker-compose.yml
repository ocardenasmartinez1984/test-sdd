version: '3.8'

services:
  monitor:
    build: .
    container_name: kiro-monitor
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-kiro-monitor-secret-change-me}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=kiro-monitor-token
      - INFLUXDB_ORG=kiro
      - INFLUXDB_BUCKET=metrics
      - SERVICE_CHECK_INTERVAL=10000
    volumes:
      - monitor-data:/app/data
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitor-net
      - default

  agent:
    build: .
    container_name: kiro-agent
    command: ["node", "src/agent/collector.js"]
    environment:
      - MONITOR_SERVER=http://monitor:3000
      - COLLECT_INTERVAL=5000
      - HOST_ID=${HOSTNAME:-docker-host}
    depends_on:
      - monitor
    restart: unless-stopped
    networks:
      - monitor-net
    # Mount host metrics (Linux only)
    # volumes:
    #   - /proc:/host/proc:ro
    #   - /sys:/host/sys:ro

  influxdb:
    image: influxdb:2.7-alpine
    container_name: kiro-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=kiro
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=kiro-monitor-token
      - DOCKER_INFLUXDB_INIT_RETENTION=7d
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitor-net

volumes:
  monitor-data:
  influxdb-data:

networks:
  monitor-net:
    driver: bridge
